
{% if messages %}
    {% for message in messages %}
        <div
            class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show"
            role="alert"
            {% if 'success' in message.tags %}data-cp-autodismiss{% endif %}
        >
            {{ message }}
            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Close"
            ></button>
        </div>
    {% endfor %}
{% endif %}
